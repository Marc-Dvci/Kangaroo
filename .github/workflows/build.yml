name: build

# Proof, on someone else's machine, that this really is a Java 26 project that really builds.
#
# The matrix is not decoration: Kangaroo is meant to run on a laptop, a Raspberry Pi and a phone,
# so a change that only compiles on Windows x64 is a change that has broken the product.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Report the toolchain
        run: |
          java -version
          javac -version

      # Every JDK 26 feature the project depends on, executing. Runs straight from source with no
      # build tool at all (JEP 458), so a failure here is unambiguous.
      - name: Single-file diagnostic
        run: java --enable-preview --add-modules jdk.incubator.vector tools/Check.java

      - name: Build and test
        run: ./mvnw -B clean package

      # The parity vectors are the strongest artifact in the repository, so make it obvious in the
      # log when they have been checked rather than burying it in surefire output.
      - name: Report parity
        if: always()
        shell: bash
        run: |
          echo "### Java engine vs LightGBM" >> "$GITHUB_STEP_SUMMARY"
          grep -h "max deviation" target/surefire-reports/*.txt 2>/dev/null \
            | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || echo "    (not found)" >> "$GITHUB_STEP_SUMMARY"
          echo "### Model / rule agreement" >> "$GITHUB_STEP_SUMMARY"
          grep -h "disagreement" target/surefire-reports/*.txt 2>/dev/null \
            | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || echo "    (not found)" >> "$GITHUB_STEP_SUMMARY"

      - name: Start it, and assess a baby over HTTP
        shell: bash
        run: |
          java --enable-preview --add-modules jdk.incubator.vector \
               --enable-native-access=ALL-UNNAMED \
               -jar target/kangaroo.jar --port 8443 --data "$RUNNER_TEMP/kangaroo" &
          pid=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8443/api/status > /dev/null 2>&1 && break
            sleep 1
          done

          # A case the WHO protocol says is an urgent referral. If this ever comes back anything
          # other than RED, the build is broken in the way that matters most.
          light=$(curl -fsS -X POST http://127.0.0.1:8443/api/assess \
            -H 'Content-Type: application/json' \
            -d '{"mode":"chw","age_days":6,"weight_kg":2.9,"sex":"female","respiratory_rate":52,
                 "intake_text":"The baby is lethargic and not feeding at all."}' \
            | grep -o '"light":"[A-Z]*"' | head -1 | cut -d'"' -f4)

          echo "traffic light: $light"
          [ "$light" = "RED" ] || { echo "::error::expected RED, got '$light'"; exit 1; }

          curl -fsS http://127.0.0.1:8443/api/jeps > /dev/null
          curl -fsS http://127.0.0.1:8443/ > /dev/null
          kill $pid 2>/dev/null || true

      - name: Upload the jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kangaroo-jar
          path: target/kangaroo.jar

  integrity:
    name: no runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # The claim is "zero runtime dependencies -- the JDK is the whole stack". The enforcer rule in
      # the pom asserts it, and this makes the assertion visible as its own check rather than a line
      # buried in a build log.
      - name: Assert the runtime dependency set is empty
        run: |
          ./mvnw -B dependency:tree -Dscope=runtime | tee tree.txt
          if grep -qE "^\[INFO\] [+\\\\]- " tree.txt; then
            echo "::error::a runtime dependency has crept in"
            exit 1
          fi
          echo "runtime dependency set is empty"

      # JEP 500. For clinical software, "no library can quietly mutate a final field in my dosing
      # table" is a safety property, and this is where it is checked rather than assumed.
      - name: Run under --illegal-final-field-access=deny
        run: |
          ./mvnw -B -q package -DskipTests
          java --enable-preview --add-modules jdk.incubator.vector \
               --enable-native-access=ALL-UNNAMED \
               --illegal-final-field-access=deny \
               -jar target/kangaroo.jar --port 8444 --data "$RUNNER_TEMP/k2" --warmup-and-exit
