# Kangaroo interface strings (English, source language).
#
# Two different things are localised in this product and it is worth being clear which is which.
# This file is the interface chrome: buttons, labels, headings. The clinical action plan a caregiver
# actually reads is generated by the language model in their own language, which is why the list of
# supported languages in Messages.SUPPORTED is longer than the list of catalogues here.
#
# Adding a catalogue is a translation job, not a code change. See docs/i18n.md.

app.name = Kangaroo
app.tagline = Offline newborn watch

start.question = Who is checking this baby?
start.lede = Kangaroo follows the World Health Organization's newborn danger-sign protocol. It works with no signal and no internet connection.
start.parent.title = I am a parent
start.parent.sub = A two-minute check, in plain language. Nothing here is a diagnosis.
start.chw.title = I am a health worker
start.chw.sub = The full IMNCI young-infant assessment, with tools and a referral letter.

